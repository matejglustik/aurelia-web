var auto=true,k=0,tour=false,advT=0;t0=performance.now();
function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function cyc(ms){var s=(ms/1000)%13;if(s<1.5)return 0;if(s<4.5)return ease((s-1.5)/3);if(s<8)return 1;if(s<11)return 1-ease((s-8)/3);return 0}

cry.position.z=34*k;bez.position.z=25*k;cas.position.z=15*k;hands.position.z=8*k;disc.position.z=-6*k;mov.position.z=-14*k;back.position.z=-23*k;
brT.position.y=17*k;brB.position.y=-17*k;crown.position.x=13*k;
gears.forEach(function(q){q.rotation.z+=q.userData.s});rotor.rotation.z-=.012;bal.rotation.z=Math.sin(now/170)*1.5;
root.rotation.y=(.3+Math.sin(now/2600)*.2)*(1-k)+(-.95+Math.sin(now/3000)*.12)*k+yO;
root.rotation.x=-.12-.15*k+pO;

root.scale.setScalar(.85+.15*ease(Math.min(1,(now-swT)/700)));var d0=Math.max(60/tn,27/(tn*asp)),d1=Math.max(86/tn,62/(tn*asp));cam.position.z=d0+(d1-d0)*k;sw.position.set(Math.sin(now/1900)*55,Math.cos(now/2700)*45,65);R.render(scene,cam);requestAnimationFrame(frame)}
